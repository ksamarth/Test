# Netlify continuous deployment for the Bailey demo.
# The site is a single self-contained static file — no build step. Netlify
# serves everything in the publish directory; bailey/public/index.html is the
# page, regenerated by bailey/build_demo.py and committed on each change.
[build]
  publish = "bailey/public"
  command = ""

# Long-cache the immutable font/data payload is unnecessary here (one HTML file);
# keep it simple and let Netlify serve index.html with its defaults.
