<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bailey — before you sign, ask Bailey.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ══ Classical — design-system tokens ══ */
:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201f1d;
  --color-accent: #b68235;
  --color-divider: color-mix(in srgb, #201f1d 16%, transparent);

  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #fff3e4;
  --color-accent-200: #ffe3bf;
  --color-accent-300: #facb8d;
  --color-accent-400: #e1ad66;
  --color-accent-500: #c28d41;
  --color-accent-600: #a06f24;
  --color-accent-700: #7d5411;
  --color-accent-800: #5a3b0a;
  --color-accent-900: #3a270d;

  --color-accent-2-100: #fff3e4;
  --color-accent-2-800: #573d14;

  /* Page-level overrides for the Classical direction: Newsreader display serif,
     Lora body, pill controls, softly rounded cards. */
  --font-heading: 'Newsreader', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;
  --font-heading-weight: 500;

  --radius-sm: 2px;
  --radius-md: 14px;
  --radius-lg: 7px;

  /* Warm, brown-tinted, layered shadows — reads like ink on paper, not a grey box */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #3a270d 10%, transparent);
  --shadow-md: 0 1px 2px color-mix(in srgb, #3a270d 9%, transparent), 0 8px 22px color-mix(in srgb, #3a270d 12%, transparent);
  --shadow-lg: 0 2px 4px color-mix(in srgb, #3a270d 8%, transparent), 0 20px 46px color-mix(in srgb, #3a270d 17%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55; font-weight: 400;
}
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 9px;
  text-wrap: balance;
}
h1 { font-weight: 400; }
p { margin: 0 0 14px; }
em { font-style: italic; }
a { color: var(--color-accent); text-underline-offset: 3px; }
a:hover { color: var(--color-accent-700); }
img { display: block; max-width: 100%; }
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — buttons (pill) — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: 9px 17px; border-radius: 999px;
}
.btn { transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
/* Solid, embossed-gold anchor button for the page's primary actions */
.btn-solid { background: var(--color-accent-700); color: var(--color-accent-100); border-color: var(--color-accent-700); }
.btn-solid:hover { background: var(--color-accent-800); border-color: var(--color-accent-800); color: var(--color-accent-100); }
.btn-solid:active { background: var(--color-accent-900); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-ghost { color: var(--color-accent-700); padding-inline: 4px; }
.btn-ghost:hover { color: var(--color-accent-800); background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-block { width: 100%; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: 9px;
  padding: 14px; border-radius: 22px; background: transparent;
  border: 1px solid var(--color-divider);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.elev-md { box-shadow: var(--shadow-md); }
.card { transition: box-shadow .22s ease, transform .22s ease, border-color .22s ease; }
@media (prefers-reduced-motion: no-preference) {
  .lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--color-accent) 45%, var(--color-divider)); }
}

/* — tags (pill) — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px; border-radius: 999px;
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — nav — */
.nav {
  border-top: 3px solid var(--color-accent);
  border-bottom: 1px solid var(--color-divider);
}
.nav-inner {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding: 20px 48px;
}
.nav a { color: var(--color-text); text-decoration: none; font-size: 15px; }
.nav a:hover { color: var(--color-accent-700); }
.nav-anchor { position: relative; padding-bottom: 2px; }
.nav-anchor::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px;
  background: var(--color-accent); transform: scaleX(0); transform-origin: left center;
  transition: transform .22s ease;
}
.nav-anchor:hover::after { transform: scaleX(1); }
.brand-home { transition: opacity .12s; }
.brand-home:hover { opacity: .68; }
/* mobile hamburger — hidden on desktop, revealed at the tablet breakpoint */
.nav-burger { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 42px; height: 42px; padding: 9px; margin-right: -9px; background: none; border: none; cursor: pointer; }
.nav-burger span { display: block; width: 100%; height: 2px; border-radius: 2px; background: var(--color-text); transition: transform .22s ease, opacity .18s ease; }
.nav-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-burger.open span:nth-child(2) { opacity: 0; }
.nav-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu { display: none; border-bottom: 1px solid var(--color-divider); background: var(--color-bg); padding: 6px 22px 20px; }
.mobile-menu.open { display: block; }
.mm-link { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--color-divider); padding: 15px 2px; font-family: var(--font-heading); font-size: 19px; color: var(--color-text); cursor: pointer; }
.mm-link[aria-current="page"] { color: var(--color-accent-800); }
.foot-link { transition: color .15s ease; }
.foot-link:hover { color: var(--color-accent-700) !important; }
.student-bar { transition: background .15s ease; }
.student-bar:hover { background: var(--color-accent-200) !important; }
.sample-pick { transition: border-color .15s ease, background .15s ease; }
.sample-pick:hover { border-color: var(--color-accent) !important; background: color-mix(in srgb, var(--color-accent) 6%, transparent) !important; }
.quiz-opt { transition: border-color .15s ease, background .15s ease; }
.quiz-opt:hover { border-color: var(--color-accent) !important; }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: 9px; border-bottom: 1px solid var(--color-divider);
}
.table td { padding: 9px; border-bottom: 1px solid var(--color-divider); vertical-align: top; }

details summary::-webkit-details-marker { color: var(--color-accent); }
.table-wrap { overflow-x: auto; }

/* Soft warm glow grounding the hero — reads as paper catching light, not a flat panel */
.hero-section {
  background:
    radial-gradient(1100px 520px at 82% 8%, color-mix(in srgb, var(--color-accent-100) 85%, transparent) 0%, transparent 62%),
    radial-gradient(900px 600px at 0% 100%, color-mix(in srgb, var(--color-accent-100) 45%, transparent) 0%, transparent 55%);
}

/* Collapse the two-column hero before the columns get cramped */
@media (max-width: 1024px) {
  .hero-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .hero-grid .hero-card-body { max-width: 620px; }
}
/* Medium band: hero stays two-column but the card is narrow, so stack the
   grade ring above the score bars instead of squishing the bars to a stub. */
@media (min-width: 1025px) and (max-width: 1400px) {
  .hero-card-body { grid-template-columns: 1fr !important; gap: 24px !important; }
}

/* Tablet and below */
@media (max-width: 820px) {
  .nav-inner { padding: 16px 22px; }
  .nav-actions { display: none !important; }
  .nav-burger { display: flex; }
  .hero-section { padding-top: 56px !important; padding-bottom: 60px !important; }
  h1.hero-title { font-size: 46px !important; }
  .pad { padding-left: 22px !important; padding-right: 22px !important; }
  .grid-collapse { grid-template-columns: 1fr !important; }
  h1.hero-title { font-size: 44px !important; }
  .stats-grid { grid-template-columns: 1fr 1fr !important; }
  .stats-grid > div { border-right: none !important; }
  .stats-grid > div:nth-child(1), .stats-grid > div:nth-child(2) { border-bottom: 1px solid var(--color-divider); }
  /* collapsed feature grids: drop the desktop column dividers and indents so the
     i-vi markers align flush down the single column */
  .feature-grid { row-gap: 10px !important; }
  .feature-grid > div { border-right: none !important; padding-left: 0 !important; padding-right: 0 !important; }
  /* built-for: drop the dot separators (they dangle at line ends when wrapped) */
  .built-for .sep { display: none !important; }
  .built-for { gap: 8px 20px !important; }
  /* landing steps: tighten the gap above and give stacked steps even spacing */
  .steps-grid { margin-top: 30px !important; row-gap: 24px !important; }
  .b2b-cta { border-left: none !important; padding-left: 0 !important; border-top: 1px solid var(--color-accent-300); padding-top: 18px; }
}

/* Phone */
@media (max-width: 560px) {
  .pad { padding-left: 16px !important; padding-right: 16px !important; }
  .nav-inner { padding: 14px 16px !important; }
  /* keep the tagline, but stack it under the wordmark so it reads as intentional */
  .nav-brand { flex-direction: column !important; align-items: flex-start !important; gap: 1px !important; }
  .brand-divider { display: none !important; }
  .brand-tag { font-size: 9.5px !important; letter-spacing: 0.12em !important; }
  body { font-size: 15px; }
  h1.hero-title { font-size: 33px !important; }
  h2 { font-size: 25px !important; }
  .hero-eyebrow { font-size: 11px !important; }
  /* let fixed-column report rows size to content */
  .exit-row { grid-template-columns: 1fr auto !important; gap: 12px !important; }
  .ask-row { grid-template-columns: 26px 1fr !important; row-gap: 6px !important; column-gap: 12px !important; }
  .ask-row .ask-worth { grid-column: 1 / -1 !important; justify-self: start !important; text-align: left !important; }
  /* reflow the 4-column market table into stacked rows */
  .mkt-head { display: none !important; }
  .mkt-row { grid-template-columns: 1fr auto !important; row-gap: 3px !important; column-gap: 12px !important; padding: 14px 0 !important; align-items: start !important; }
  .mkt-row > :nth-child(1) { grid-column: 1; grid-row: 1; }
  .mkt-row > :nth-child(4) { grid-column: 2; grid-row: 1; }
  .mkt-row > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .mkt-row > :nth-child(3) { grid-column: 1 / -1; grid-row: 3; }
  .mkt-row > :nth-child(2)::before { content: "This offer: "; color: var(--color-neutral-600); }
  .mkt-row > :nth-child(3)::before { content: "Typical: "; color: var(--color-neutral-600); }
  /* grade ring a touch smaller so it never crowds the width */
  .grade-ring-lg { width: 168px !important; height: 168px !important; }
  .grade-ring-lg .grade-letter { font-size: 64px !important; }
  /* red-flag rows: stack the cost column above the note */
  .flag-body { grid-template-columns: 1fr !important; gap: 8px !important; }
  .flag-cost { border-right: none !important; padding-right: 0 !important; }
  /* hero sample card: stack the grade ring above the score bars */
  .hero-card-body { grid-template-columns: 1fr !important; gap: 20px !important; }
  .hero-ring { width: 150px !important; height: 150px !important; }
  .hero-ring span:first-child { font-size: 54px !important; }
}

/* Print / Save-as-PDF: strip the chrome and print the report cleanly */
@media print {
  .nav, .student-bar, .mobile-menu, footer, .no-print { display: none !important; }
  body { background: #fff; }
  main { max-width: none !important; padding: 0 24px !important; }
  .card { box-shadow: none !important; }
  a { color: inherit; text-decoration: none; }
  section { break-inside: avoid; }
  .flag-row, .ask-row, .exit-row, .mkt-row, tr { break-inside: avoid; }
  /* the compare table is wide on screen; shrink it to fit a printed page */
  .cmp-table { min-width: 0 !important; font-size: 10.5px !important; }
  .cmp-table th, .cmp-table td { padding: 5px 6px !important; }
}
</style>

<body>
<div id="app" style="min-height:100vh;display:flex;flex-direction:column;"></div>

<script>
/* Guarantee a responsive viewport. The artifact host wraps this page in its own
   <head>; without width=device-width, phones render at a ~980px layout and zoom
   out, and the mobile breakpoints never fire. Assert it during parse AND again
   on DOMContentLoaded/load, in case the host sets its own viewport after us. */
(function () {
  function forceViewport() {
    var m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m); }
    if (m.getAttribute("content") !== "width=device-width, initial-scale=1") {
      m.setAttribute("content", "width=device-width, initial-scale=1");
    }
  }
  forceViewport();
  document.addEventListener("DOMContentLoaded", forceViewport);
  window.addEventListener("load", forceViewport);
})();
</script>

<script>
"use strict";

/* ─────────────────────────  helpers  ───────────────────────── */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (v) => (v == null ? "—" : "$" + Number(v).toLocaleString());
const dash = (v) => (v === null || v === undefined || v === "" ? "—" : v);

const CATEGORY_LABELS = {
  compensation: "Compensation",
  restrictive_covenants: "Restrictive covenants",
  insurance_and_benefits: "Insurance & benefits",
  termination_and_flexibility: "Termination & flexibility",
};
const VERDICT = {
  favorable:   { cls: "tag tag-accent-2", lbl: "Above market" },
  typical:     { cls: "tag tag-neutral",  lbl: "Market" },
  unfavorable: { cls: "tag tag-accent",   lbl: "Below market" },
  missing:     { cls: "tag tag-outline",  lbl: "Missing" },
};
const ROMAN = ["i.", "ii.", "iii.", "iv.", "v.", "vi.", "vii.", "viii."];
const ANALYZE_STEPS = [
  "Reading every clause in the contract",
  "Benchmarking each term against the market",
  "Modeling your first-year earnings",
  "Totaling the cost of leaving",
  "Writing your negotiation email",
];

const app = document.getElementById("app");
const STORE_KEY = "bailey.offers.v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function loadOffers() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { return []; }
}
function saveOffers() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.offers)); } catch (e) { /* quota / private mode */ }
}

const PROFILE_KEY = "bailey.profile.v1";
const ASKED_KEY = "bailey.quizasked.v1";
function loadProfile() { try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) || null; } catch (e) { return null; } }
function saveProfile() { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile)); } catch (e) { /* ignore */ } }
function loadAsked() { try { return localStorage.getItem(ASKED_KEY) === "1"; } catch (e) { return false; } }
function saveAsked() { try { localStorage.setItem(ASKED_KEY, "1"); } catch (e) { /* ignore */ } }

/* Optional "tell Bailey about your situation" questionnaire — re-weights the
   review to the reader's life. Kept short; answers live only in the browser. */
const QUIZ = [
  { key: "stage",    q: "Where are you in your career?", opts: [["student", "Student"], ["newgrad", "New grad"], ["early", "1-5 years in"], ["established", "Established"]] },
  { key: "ties",     q: "How tied are you to this area?", opts: [["rooted", "Rooted here"], ["some", "Somewhat"], ["open", "Open to relocating"]] },
  { key: "debt",     q: "Student debt?", opts: [["none", "None"], ["low", "Under $100k"], ["mid", "$100k-$250k"], ["high", "Over $250k"]] },
  { key: "plans",    q: "Anything big on the horizon?", opts: [["relocate", "Relocating soon"], ["family", "Starting a family"], ["home", "Buying a home"], ["none", "Not right now"]] },
  { key: "priority", q: "What matters most in this job?", opts: [["income", "Maximizing income"], ["stability", "Stability & predictability"], ["flexibility", "Flexibility & lifestyle"]] },
];

/* A session library of analyzed offers, persisted client-side. */
const state = {
  stage: "landing",     // landing | analyzing | report | compare | shared | how | features | pricing | faq
  offers: loadOffers(), // [{ id, filename, analysis }]
  activeId: null,       // offer shown in the report view
  filename: "",         // file being analyzed (for the analyzing stage)
  step: 0, error: "", copied: false,
  sharedOffer: null,    // a read-only review decoded from a #r= share link
  sharedCopied: false,  // "Link copied" state on the Share button
  pickerOpen: false,    // sample-offer picker modal
  profile: loadProfile(), // optional questionnaire answers
  quizOpen: false,      // questionnaire modal
  quizDraft: {},        // in-progress questionnaire selections
  quizAsked: loadAsked(), // have we already offered the questionnaire once?
  pendingAction: null,  // analysis to run after the pre-review questionnaire
  pendingPaidAction: null, // analysis to run once payment clears
  org: null,            // active institutional partner (co-branded mode)
  checkoutOpen: false,  // payment modal
  checkoutStudent: false,
  adminOpen: false,     // institution sign-in modal
  adminError: "",
};

// Demo institution access codes → org id. Real product: magic-link / SSO per school.
const ADMIN_CODES = { osu2026: "osu" };

/* Offer the questionnaire once, right before the first review — then run the
   analysis whether they fill it out or skip. */
function maybeQuizThen(action) {
  if (state.profile || state.quizAsked) { action(); return; }
  state.pendingAction = action;
  set({ quizOpen: true, quizDraft: {} });
}
function closeQuiz(save) {
  if (save) { state.profile = Object.assign({}, state.quizDraft); saveProfile(); }
  state.quizAsked = true; saveAsked();
  const action = state.pendingAction; state.pendingAction = null;
  state.quizOpen = false;
  if (action) action(); else render();
}

/* Reviewing your OWN offer is paid: collect payment first, then run the
   analysis. Institution-covered readers skip the paywall entirely. Free
   sample previews never come through here. */
function startPaidReview(action) {
  if (state.org) { maybeQuizThen(action); return; }
  state.pendingPaidAction = action;
  set({ checkoutOpen: true });
}
let stepTimer = null;

function set(patch) { Object.assign(state, patch); render(); }
function activeOffer() {
  if (state.stage === "shared" && state.sharedOffer) return state.sharedOffer;
  return state.offers.find(o => o.id === state.activeId) || null;
}
function offerLabel(o) { return (o.analysis && o.analysis.extraction && o.analysis.extraction.employer_name) || o.filename || "Offer"; }

/* ── shareable report links ──
   A review is encoded into the URL hash (#r=…) so it can be opened by anyone
   with the link — no account, no server. Gzip-compressed when the browser
   supports CompressionStream, otherwise plain base64url of the JSON. */
function b64urlFromBytes(bytes) { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function bytesFromB64url(str) { str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "="; const bin = atob(str); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function encodeShare(obj) {
  const json = JSON.stringify(obj);
  if (window.CompressionStream) {
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    return "g" + b64urlFromBytes(new Uint8Array(buf));
  }
  return "r" + b64urlFromBytes(new TextEncoder().encode(json));
}
async function decodeShare(payload) {
  const kind = payload[0], data = payload.slice(1);
  if (kind === "g") {
    const txt = await new Response(new Blob([bytesFromB64url(data)]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(txt);
  }
  return JSON.parse(new TextDecoder().decode(bytesFromB64url(data)));
}
async function shareReport() {
  const o = activeOffer();
  if (!o) return;
  try {
    let url;
    if (o.sampleId) {
      // Sample reviews get a short, clean link — the whole review is a known
      // scenario, so we only need its id (e.g. #s=rough), not the full payload.
      url = location.origin + location.pathname + "#s=" + o.sampleId;
    } else {
      const payload = await encodeShare({ v: 1, filename: o.filename, analysis: o.analysis });
      url = location.origin + location.pathname + "#r=" + payload;
    }
    try { await navigator.clipboard.writeText(url); } catch (e) { /* clipboard blocked */ }
    state.sharedCopied = true; render();
    setTimeout(() => { state.sharedCopied = false; render(); }, 1900);
  } catch (e) { /* ignore */ }
}
function showShared(analysis, filename) {
  state.sharedOffer = { id: "shared", filename: filename || "Shared review", analysis: analysis };
  state.stage = "shared"; render(); window.scrollTo(0, 0);
}
function openSharedFromHash() {
  const hash = location.hash || "";
  const shortMatch = hash.match(/^#s=([a-z0-9_-]+)$/i);
  if (shortMatch) {
    return sampleAnalysisFor(shortMatch[1]).then(a => { if (a) { showShared(a, "Shared review"); return true; } return false; }).catch(() => false);
  }
  const m = hash.match(/^#r=(.+)$/);
  if (!m) return Promise.resolve(false);
  return decodeShare(m[1]).then(obj => {
    if (obj && obj.analysis) { showShared(obj.analysis, obj.filename); return true; }
    return false;
  }).catch(() => false);
}
function clearHash() { if (location.hash) history.replaceState(null, "", location.pathname + location.search); }

/* ─────────────────────────  flow  ───────────────────────── */
function beginAnalysis(runFetch, filename, meta) {
  clearInterval(stepTimer);
  set({ stage: "analyzing", step: 0, filename, error: "" });

  const promise = runFetch();
  let resolved = null, failed = null;
  promise.then(d => { resolved = d; }).catch(e => { failed = e; });

  stepTimer = setInterval(() => {
    if (failed) { clearInterval(stepTimer); finishFail(failed); return; }
    if (state.step < ANALYZE_STEPS.length - 1) { set({ step: state.step + 1 }); return; }
    // On the last step: wait for the network before showing the report.
    if (resolved) { clearInterval(stepTimer); finishOk(resolved, filename, meta); }
    else if (failed) { clearInterval(stepTimer); finishFail(failed); }
  }, 900);
}
function finishOk(resolved, filename, meta) {
  const offer = { id: uid(), filename: resolved.filename || filename, analysis: resolved.analysis };
  if (meta && meta.sampleId) offer.sampleId = meta.sampleId;
  state.offers = state.offers.concat([offer]);
  saveOffers();
  set({ stage: "report", activeId: offer.id, error: "" });
}
function finishFail(failed) {
  set({ stage: "landing", error: failed.message || "Something went wrong." });
}

/* ─────────────────────────  library navigation  ───────────────────────── */
function openReport(id) { set({ stage: "report", activeId: id, error: "" }); }
function openCompare() { if (state.offers.length >= 2) set({ stage: "compare", error: "" }); }

/* Load the sample offers (any not already in the library) and open the
   side-by-side comparison — powers the picker's "compare all three". */
function loadCompareSamples() {
  clearInterval(stepTimer);
  const have = new Set(state.offers.map(o => o.sampleId).filter(Boolean));
  const need = SAMPLES.filter(s => !have.has(s.id));
  if (!need.length) { set({ pickerOpen: false, stage: "compare", error: "" }); window.scrollTo(0, 0); return; }
  set({ pickerOpen: false, stage: "analyzing", step: 0, filename: "Comparing sample offers", error: "" });
  let i = 0;
  stepTimer = setInterval(() => { if (i < ANALYZE_STEPS.length - 1) set({ step: ++i }); }, 650);
  Promise.all(need.map(s => sampleAnalysisFor(s.id))).then(list => {
    clearInterval(stepTimer);
    const added = list.map((a, idx) => ({ id: uid(), filename: need[idx].label, analysis: a, sampleId: need[idx].id }));
    state.offers = state.offers.concat(added);
    saveOffers();
    set({ stage: "compare", error: "" });
    window.scrollTo(0, 0);
  }).catch(() => { clearInterval(stepTimer); set({ stage: "landing", error: "Could not load the sample comparison." }); });
}
function newReview() { clearHash(); set({ stage: "landing", error: "", sharedOffer: null }); }
function removeOffer(id) {
  state.offers = state.offers.filter(o => o.id !== id);
  saveOffers();
  if (state.offers.length === 0) return set({ stage: "landing", activeId: null });
  if (state.stage === "compare" && state.offers.length < 2) return set({ stage: "report", activeId: state.offers[0].id });
  if (state.activeId === id) return set({ activeId: state.offers[0].id });
  render();
}

async function post(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function analyzeFile(file) {
  beginAnalysis(() => {
    const body = new FormData();
    body.append("file", file);
    if (state.profile) body.append("profile", JSON.stringify(state.profile));
    if (state.org) body.append("org", state.org.id);
    return post("/api/analyze", { method: "POST", body });
  }, file.name);
}

function analyzeSample(id) {

/* Map the reader's answers against this offer's actual terms → up to 3
   specific, personalized callouts. Heuristic in the demo; in the real app
   the answers feed the analysis prompt directly. */
function personalInsights(a, p) {
  const x = a.extraction || {}, rc = x.restrictive_covenants || {}, comp = x.compensation || {}, ben = x.benefits || {};
  const out = [];
  const loc = x.location || "your area";
  const ncStr = [rc.non_compete_radius_miles ? rc.non_compete_radius_miles + " mi" : null, rc.non_compete_duration_months ? rc.non_compete_duration_months + " mo" : null].filter(Boolean).join(" / ");
  const hasNC = !!ncStr;
  const shakyIncome = comp.compensation_basis === "collections" || comp.daily_guarantee == null || (comp.guarantee_duration_months != null && comp.guarantee_duration_months <= 3);
  const payPhrase = comp.daily_guarantee == null ? "no income guarantee at all" : (comp.compensation_basis === "collections" ? "collections-based pay" : "short pay guarantee");

  if (hasNC && p.ties === "rooted") out.push("You're planning to stay in " + loc + ". That makes this offer's non-compete (" + ncStr + ") one of its most important terms — breaking it could force you out of the area you want to stay in. Treat it as a top-priority ask.");
  else if (hasNC && (p.ties === "open" || p.plans === "relocate")) out.push("Since you're open to moving, the non-compete (" + ncStr + ") is far less of a constraint for you than it looks on paper — spend your negotiating leverage on the money instead.");

  if ((p.debt === "mid" || p.debt === "high") && shakyIncome) out.push("With significant student loans, steady income matters more than the letter grade suggests. This offer's " + payPhrase + " could make your early months volatile — push hardest on the guarantee and how you're paid.");

  if (p.plans === "family" && ben.pto && /(^|\b)(none|0|[1-7])\b/i.test(String(ben.pto))) out.push("If you're planning for family time, the thin PTO in this offer is a bigger deal than it looks — and it's a low-cost ask that employers often grant.");

  if (p.plans === "home" && shakyIncome && out.length < 3) out.push("A home purchase leans on predictable income — worth firming up the " + (comp.daily_guarantee == null ? "pay guarantee" : "compensation basis") + " here before you commit to a mortgage.");

  if (out.length < 3) {
    if (p.priority === "income" && !out.some(s => /pay|paid|money|compensation|income/i.test(s))) out.push("You're optimizing for income, so the compensation structure is your highest-leverage point on this offer — that's where the negotiation email should lead.");
    else if (p.priority === "stability" && shakyIncome && !out.some(s => /guarantee|income/i.test(s))) out.push("You value stability, and the " + payPhrase + " is the term most at odds with that here — make it your first ask.");
    else if (p.priority === "flexibility") out.push("Since flexibility matters most to you, weigh the schedule, PTO, and termination terms as heavily as the pay when you decide.");
  }
  return out.slice(0, 3);
}

/* How much a given clause/ask matters to THIS reader, from their answers.
   Used to re-rank the report so the terms that matter most to them rise. */
function personalBoost(str, p) {
  if (!p) return 0;
  const s = (str || "").toLowerCase();
  const nc = /non-?compete|covenant|restrict|liquidated|non-?solicit/.test(s);
  const pay = /compensation|collection|guarantee|\bpay\b|split|management fee|production|1099|classif|clawback|bonus/.test(s);
  const life = /\bpto\b|\bce\b|schedule|termination|notice|on-call|weekend|records|patient|flexib/.test(s);
  let b = 0;
  if (nc) { if (p.ties === "rooted") b += 3; else if (p.ties === "open" || p.plans === "relocate") b -= 2; }
  if (pay) { if (p.debt === "high") b += 3; else if (p.debt === "mid") b += 2; if (p.priority === "income" || p.priority === "stability") b += 2; if (p.plans === "home") b += 2; }
  if (life) { if (p.plans === "family") b += 3; if (p.priority === "flexibility") b += 2; }
  return b;
}

      <button class="btn btn-ghost no-print" data-quiz style="font-size:12.5px;padding:3px 8px;">Update answers</button>
    </div>
    <div style="padding:20px 24px;display:flex;flex-direction:column;gap:16px;">
      ${ins.map((t, i) => `<div style="display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:baseline;"><span style="font-family:var(--font-heading);color:var(--color-accent);font-size:18px;font-feature-settings:'tnum';">${i + 1}</span><p style="font-size:15px;line-height:1.6;margin:0;">${esc(t)}</p></div>`).join("")}
    </div>
  </section>`;
}

function report() {
  const offer = activeOffer();
  const a = offer.analysis;
  const x = a.extraction;
  const s = a.score;
  // The reader's profile personalizes their own reviews (not shared ones).
  const prof = state.stage === "shared" ? null : state.profile;
  const forYouTag = `<span class="tag tag-accent-2">Priority for you</span>`;

  const categories = s.categories.map(c => `
    <div style="padding:11px 0;border-top:1px solid var(--color-divider);">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <strong style="font-size:14px;">${esc(CATEGORY_LABELS[c.category] || c.category)}</strong>
        <span style="font-size:13.5px;font-feature-settings:'tnum';color:var(--color-accent-700);">${c.score}/100</span>
      </div>
      <div style="height:3px;background:var(--color-neutral-200);"><div style="height:3px;background:var(--color-accent);width:${Math.max(2,Math.min(100,c.score))}%;"></div></div>
      <div class="text-muted" style="font-size:12.5px;margin-top:5px;">${esc(c.rationale)}</div>
    </div>`).join("");

  const f = a.financial_analysis;
  const scenarios = f.scenarios.map(sc => `
    <tr>
      <td><strong>${esc(sc.label)}</strong></td>
      <td style="font-feature-settings:'tnum';">${sc.assumed_daily_production == null ? "—" : money(sc.assumed_daily_production) + "/day"}</td>
      <td><span style="font-family:var(--font-heading);font-size:21px;font-feature-settings:'tnum';">${money(sc.estimated_annual_gross)}</span></td>
      <td class="text-muted" style="font-size:12.5px;">${esc(sc.how_calculated)}</td>
    </tr>`).join("");
  const breakeven = f.break_even_daily_production == null ? "" : `
    <div style="border:1px solid var(--color-accent-300);padding:16px 22px;margin-top:20px;font-size:14px;max-width:86ch;">
      <strong>Break-even: ${money(f.break_even_daily_production)}/day.</strong> ${esc(f.break_even_explanation || "")}
    </div>`;
  const split = f.effective_split_note ? `<p style="font-size:15px;max-width:78ch;margin-top:18px;">${esc(f.effective_split_note)}</p>` : "";
  const assumptions = `<details style="margin-top:14px;">
      <summary style="cursor:pointer;font-size:13px;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:3px;">Assumptions behind these numbers</summary>
      <ul style="margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--color-neutral-800);">${f.assumptions.map(z => `<li style="margin-bottom:4px;">${esc(z)}</li>`).join("")}</ul>
    </details>`;

  const e = a.exit_costs;
  const leaving = e.items.map(l => `
    <div class="exit-row" style="display:grid;grid-template-columns:1fr 190px;gap:24px;padding:15px 0;border-bottom:1px solid var(--color-divider);">
      <div><strong style="font-size:15px;">${esc(l.item)}</strong><div class="text-muted" style="font-size:13px;margin-top:2px;max-width:74ch;">${esc(l.basis)}</div></div>
      <div style="font-family:var(--font-heading);font-size:21px;font-feature-settings:'tnum';text-align:right;">${esc(l.estimated_cost)}</div>
    </div>`).join("");

  const benchmarks = a.market_comparison.map(b => {
    const v = VERDICT[b.verdict] || VERDICT.typical;
    return `<div class="mkt-row" style="display:grid;grid-template-columns:150px 1fr 1fr 130px;gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;align-items:center;">
      <strong>${esc(b.term)}</strong>
      <span>${esc(b.this_offer)}</span>
      <span class="text-muted">${esc(b.typical_range)}</span>
      <span style="text-align:right;"><span class="${v.cls}">${v.lbl}</span></span>
    </div>`;
  }).join("");

  const SEV_ORDER = { high: 0, medium: 1, low: 2 };
  const flagRanked = a.red_flags.map(fl => ({ fl, boost: personalBoost((fl.title || "") + " " + (fl.explanation || ""), prof) }));
  flagRanked.sort((p, q) => (q.boost - p.boost) || ((SEV_ORDER[p.fl.severity] ?? 9) - (SEV_ORDER[q.fl.severity] ?? 9)));
  const topFlag = (prof && flagRanked[0] && flagRanked[0].boost > 0) ? flagRanked[0].fl : null;
  const flags = flagRanked
    .map(({ fl }, i) => {
      const rank = String(i + 1).padStart(2, "0");
      const sevCls = fl.severity === "high" ? "tag tag-accent" : "tag tag-neutral";
      const sevLabel = fl.severity === "high" ? "High risk" : "Worth fixing";
      return `
    <div class="flag-row" style="display:grid;grid-template-columns:34px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--color-divider);">
      <span style="font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum';">${rank}</span>
      <div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
          <span style="font-family:var(--font-heading);font-size:20px;">${esc(fl.title)}</span>
          <span class="${sevCls}">${sevLabel}</span>
          ${fl === topFlag ? forYouTag : ""}
          ${fl.timing ? `<span class="tag tag-outline">${esc(fl.timing)}</span>` : ""}
        </div>
        <div class="flag-body" style="display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start;">
          <div class="flag-cost" style="border-right:1px solid var(--color-divider);padding-right:18px;">
            <div class="text-muted" style="font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;">Cost if ignored</div>
            <div style="font-family:var(--font-heading);font-size:18px;color:var(--color-accent-700);margin-top:3px;">${fl.cost_if_ignored ? esc(fl.cost_if_ignored) : "—"}</div>
          </div>
          <p class="text-muted" style="font-size:13px;line-height:1.6;margin:0;max-width:90ch;">${esc(fl.explanation)}</p>
        </div>
      </div>
    </div>`;
    }).join("");

  const askRanked = a.negotiation_playbook.map(k => ({ k, boost: personalBoost((k.topic || "") + " " + (k.suggested_ask || "") + " " + (k.rationale || ""), prof) }));
  askRanked.sort((p, q) => (q.boost - p.boost) || ((p.k.priority || 9) - (q.k.priority || 9)));
  const topAsk = (prof && askRanked[0] && askRanked[0].boost > 0) ? askRanked[0].k : null;
  const asks = askRanked.map(({ k }, i) => `
    <div class="ask-row" style="display:grid;grid-template-columns:48px 1fr 190px;gap:16px;padding:15px 0;border-bottom:1px solid var(--color-divider);">
      <span style="font-family:var(--font-heading);font-size:20px;color:var(--color-accent);font-feature-settings:'tnum';">${i + 1}</span>
      <div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><strong style="font-size:15px;">${esc(k.topic)}</strong>${k === topAsk ? forYouTag : ""}</div><div class="text-muted" style="font-size:13px;margin-top:4px;font-style:italic;">${esc(k.suggested_ask)}</div></div>
      ${k.estimated_value ? `<span class="ask-worth" style="font-size:14px;font-feature-settings:'tnum';text-align:right;border-bottom:1px solid var(--color-accent);align-self:start;justify-self:end;">worth ${esc(k.estimated_value)}</span>` : `<span></span>`}
    </div>`).join("");

  // ── redesigned report: verdict tier, at-a-glance, top actions, clause cards ──
  const TIERS = [
    { min: 80, label: "Strong", rank: 4, color: "#177268", soft: "#dcebe8" },
    { min: 65, label: "Fair", rank: 3, color: "#9a6c1f", soft: "#eee1c9" },
    { min: 50, label: "Below market", rank: 2, color: "#a8402c", soft: "#f2dbd4" },
    { min: -1, label: "One-sided", rank: 1, color: "#8f2f1f", soft: "#f2dbd4" },
  ];
  const tier = TIERS.find(t => s.overall >= t.min) || TIERS[TIERS.length - 1];
  const tierScale = [1, 2, 3, 4].map(n => `<span style="width:30px;height:6px;border-radius:3px;background:${n <= tier.rank ? tier.color : "var(--color-neutral-200)"};"></span>`).join("");
  const expSc = f.scenarios.find(z => /expect/i.test(z.label)) || f.scenarios[Math.floor(f.scenarios.length / 2)] || f.scenarios[0];
  const highCount = a.red_flags.filter(fl => fl.severity === "high").length;
  const topRiskTitle = flagRanked[0] ? flagRanked[0].fl.title : "—";
  const glance = [
    expSc ? { l: "Expected first-year", v: money(expSc.estimated_annual_gross), sub: "gross, typical volume" } : null,
    { l: "Biggest risk", v: esc(topRiskTitle), sub: highCount ? highCount + " high-severity flag" + (highCount > 1 ? "s" : "") : "worth a look", clamp: true },
    (e && e.estimated_total) ? { l: "Cost of leaving early", v: esc(e.estimated_total), sub: "if it ends at 12 months" } : null,
    { l: "Red flags found", v: String(a.red_flags.length), sub: "priced & prioritized" },
  ].filter(Boolean);
  const glanceHtml = glance.map(g => `<div style="background:#faf9f6;padding:16px 16px 15px;">
      <div style="font-family:var(--font-body);font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-neutral-600);">${g.l}</div>
      <div style="font-family:var(--font-heading);font-size:${g.clamp ? 18 : 22}px;margin-top:8px;line-height:1.12;${g.clamp ? "display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;" : ""}">${g.v}</div>
      <div style="font-size:11.5px;color:var(--color-neutral-800);margin-top:5px;">${g.sub}</div>
    </div>`).join("");
  const actionCards = askRanked.slice(0, 3).map(({ k }, i) => `
    <div style="background:#faf9f6;border:1px solid var(--color-divider);border-radius:15px;padding:19px 21px;display:grid;grid-template-columns:30px 1fr;gap:15px;">
      <div style="font-family:var(--font-heading);font-size:21px;color:var(--color-accent);border-right:1px solid var(--color-divider);padding-right:13px;">${i + 1}</div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:17px;font-weight:600;">${esc(k.topic)}</span>${k === topAsk ? forYouTag : ""}</div>
        <div style="font-size:14px;color:var(--color-neutral-800);margin-top:6px;">${esc(k.rationale)}</div>
        ${k.suggested_ask ? `<div style="font-size:13px;color:var(--color-neutral-600);font-style:italic;margin-top:6px;">Ask: “${esc(k.suggested_ask)}”</div>` : ""}
        ${k.estimated_value ? `<span style="display:inline-block;margin-top:11px;font-family:var(--font-body);font-size:12px;font-weight:600;background:var(--color-accent-100);color:var(--color-accent-800);padding:4px 12px;border-radius:999px;">${/[$\d]/.test(k.estimated_value) ? "Worth " : ""}${esc(k.estimated_value)}</span>` : ""}
      </div>
    </div>`).join("");
  const moreAsks = askRanked.slice(3);
  const moreAsksHtml = moreAsks.map(({ k }, i) => `
      <div class="ask-row" style="display:grid;grid-template-columns:1fr 190px;gap:16px;padding:15px 0;border-bottom:1px solid var(--color-divider);">
        <div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><strong style="font-size:15px;">${esc(k.topic)}</strong>${k === topAsk ? forYouTag : ""}</div><div class="text-muted" style="font-size:13px;margin-top:4px;font-style:italic;">${esc(k.suggested_ask)}</div></div>
        ${k.estimated_value ? `<span class="ask-worth" style="font-size:14px;text-align:right;${/[$\d]/.test(k.estimated_value) ? "border-bottom:1px solid var(--color-accent);" : ""}align-self:start;justify-self:end;">${/[$\d]/.test(k.estimated_value) ? "worth " : ""}${esc(k.estimated_value)}</span>` : `<span></span>`}
      </div>`).join("");
  const clauseCards = flagRanked.map(({ fl }) => {
    const sev = fl.severity === "high" ? { lbl: "Problem", c: "#a8402c", soft: "#f2dbd4" }
      : fl.severity === "medium" ? { lbl: "Watch", c: "#9a6c1f", soft: "#eee1c9" }
      : { lbl: "Minor", c: "#177268", soft: "#dcebe8" };
    return `<div style="background:#faf9f6;border:1px solid var(--color-divider);border-left:3px solid ${sev.c};border-radius:12px;padding:17px 19px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-family:var(--font-heading);font-size:17px;">${esc(fl.title)}</span>
        ${fl === topFlag ? forYouTag : ""}
        ${fl.timing ? `<span class="tag tag-outline">${esc(fl.timing)}</span>` : ""}
        <span style="margin-left:auto;font-family:var(--font-body);font-size:10.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;background:${sev.soft};color:${sev.c};padding:3px 10px;border-radius:999px;">${sev.lbl}</span>
      </div>
      <p style="font-size:13.5px;color:var(--color-neutral-800);line-height:1.6;margin:10px 0 0;">${esc(fl.explanation)}</p>
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--color-divider);font-size:13.5px;">
        <span style="max-width:74ch;"><strong style="color:var(--color-accent-800);">Do:</strong> ${esc(fl.what_to_do)}</span>
        ${fl.cost_if_ignored ? `<span style="font-family:var(--font-body);font-size:12.5px;color:#a8402c;white-space:nowrap;">${esc(fl.cost_if_ignored)}</span>` : ""}
      </div>
    </div>`;
  }).join("");
  const strengthsHtml = (a.strengths && a.strengths.length)
    ? a.strengths.map(z => `<div style="display:grid;grid-template-columns:20px 1fr;gap:10px;padding:7px 0;font-size:14px;"><span style="color:#177268;">&#10003;</span><span>${esc(z)}</span></div>`).join("")
    : `<p class="text-muted" style="font-size:14px;">No standout strengths were flagged in this offer.</p>`;

  const tags = [
    x.employer_name ? `<span class="tag tag-accent">${esc(x.employer_name)}</span>` : "",
    (x.position_title || x.location) ? `<span class="tag tag-neutral">${esc([x.position_title, x.location].filter(Boolean).join(" · "))}</span>` : "",
  ].join("");

  const shared = state.stage === "shared";
  const sharedBanner = `<div class="no-print" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px;border:1px solid var(--color-accent-300);background:var(--color-accent-100);border-radius:14px;padding:14px 20px;">
      <span style="font-size:14px;color:var(--color-accent-900);">You're viewing a <strong>shared review</strong>. Want the same for your own offer?</span>
      <button class="btn btn-solid" data-page="landing" style="font-size:14px;padding:10px 20px;">Analyze my offer &rarr;</button>
    </div>`;
  return navBar(shared ? "shared" : undefined) + `
  <main class="pad" style="flex:1;width:100%;max-width:1000px;margin:0 auto;padding:40px 48px 80px;">
    ${shared ? sharedBanner : switcher(offer.id)}
    <div class="no-print" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:32px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">${tags}</div>
      <div style="display:flex;gap:10px;">
        ${shared ? "" : `<button class="btn btn-secondary" data-share style="font-size:13px;padding:7px 16px;">${state.sharedCopied ? "Link copied ✓" : "↗ Share"}</button>`}
        <button class="btn btn-secondary" data-print style="font-size:13px;padding:7px 16px;">↓ Save as PDF</button>
      </div>
    </div>${shared ? "" : ""}

    <style>
      .rsec{ border-top:1px solid var(--color-divider); }
      .rsec>summary{ list-style:none; cursor:pointer; padding:20px 0; display:flex; align-items:center; gap:14px; }
      .rsec>summary::-webkit-details-marker{ display:none; }
      .rsec>summary:focus-visible{ outline:2px solid var(--color-accent); outline-offset:3px; border-radius:6px; }
      .rchev{ width:22px; height:22px; border-radius:50%; border:1px solid var(--color-neutral-300); display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:var(--color-neutral-600); transition:transform .2s; flex:none; }
      .rsec[open] .rchev{ transform:rotate(90deg); }
      .rtitle{ font-family:var(--font-heading); font-size:21px; }
      .rhint{ margin-left:auto; font-size:12px; color:var(--color-neutral-600); text-align:right; }
      .rbody{ padding:2px 0 30px; }
      .r-glance{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--color-divider); border:1px solid var(--color-divider); border-radius:14px; overflow:hidden; }
      @media print{ .rbody{ display:block!important; } .rsec>*:not(summary){ display:revert!important; } .rchev{ display:none; } }
    </style>

    <section style="padding-bottom:34px;border-bottom:1px solid var(--color-divider);">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <span style="display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:${tier.soft};color:${tier.color};border:1px solid ${tier.color}55;">
          <span style="width:9px;height:9px;border-radius:50%;background:${tier.color};"></span>
          <strong style="font-family:var(--font-heading);font-weight:600;font-size:18px;">${tier.label}</strong>
        </span>
        <span style="font-size:12.5px;color:var(--color-neutral-600);">offer grade</span>
      </div>
      <h2 style="font-family:var(--font-heading);font-weight:500;font-size:clamp(28px,4vw,38px);line-height:1.14;margin:22px 0 0;max-width:30ch;">${esc(s.headline)}</h2>
      <p style="font-size:clamp(16px,2.2vw,18px);color:var(--color-neutral-800);margin:16px 0 0;max-width:72ch;">${esc(a.summary)}</p>
      <div class="r-glance" style="margin-top:30px;">${glanceHtml}</div>
    </section>
    ${shared ? "" : tailoredPanel(a)}

    <section style="margin-top:40px;">
      <div style="font-family:var(--font-body);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-800);font-weight:600;">Do this before you sign</div>
      <h2 style="font-family:var(--font-heading);font-weight:500;font-size:clamp(21px,3vw,27px);margin:8px 0 0;">Your move, in order of what it's worth.</h2>
      <p class="text-muted" style="font-size:14px;margin:10px 0 0;max-width:66ch;">You don't need to read the rest to act — the analysis below is the receipts. ${esc(a.value_at_stake)}</p>
      <div style="display:flex;flex-direction:column;gap:13px;margin-top:22px;">${actionCards}</div>
    </section>

    <div style="margin-top:40px;">
      <details class="rsec">
        <summary><span class="rchev">&#9656;</span><span class="rtitle">The money — what you'd really earn</span><span class="rhint">the CPA read &middot; ${f.scenarios.length} scenarios</span></summary>
        <div class="rbody">
          <div class="table-wrap"><table class="table" style="margin-top:6px;min-width:620px;">
            <thead><tr><th>Scenario</th><th>Assumed production</th><th>Est. gross</th><th style="width:46%;">How it's calculated</th></tr></thead>
            <tbody>${scenarios}</tbody>
          </table></div>
          ${breakeven}${split}${assumptions}
          <h3 style="font-family:var(--font-heading);font-weight:500;font-size:18px;margin:32px 0 4px;">The price of leaving</h3>
          <p class="text-muted" style="font-size:13px;margin:0 0 4px;">${esc(e.scenario)}:</p>
          ${leaving}
          <div style="display:flex;justify-content:space-between;padding:15px 0;border-bottom:2px solid var(--color-text);font-size:15px;"><em>Exit bill total</em><strong style="font-feature-settings:'tnum';">${esc(e.estimated_total)}</strong></div>
          <p class="text-muted" style="font-size:12.5px;margin-top:12px;max-width:80ch;">${esc(e.note)}</p>
        </div>
      </details>

      <details class="rsec">
        <summary><span class="rchev">&#9656;</span><span class="rtitle">The contract, flagged</span><span class="rhint">the lawyer's read &middot; ${a.red_flags.length} findings${topFlag ? " &middot; ranked for you" : ""}</span></summary>
        <div class="rbody"><div style="display:flex;flex-direction:column;gap:12px;">${clauseCards}</div></div>
      </details>

      <details class="rsec">
        <summary><span class="rchev">&#9656;</span><span class="rtitle">Every term vs. the market</span><span class="rhint">${a.market_comparison.length} terms benchmarked</span></summary>
        <div class="rbody"><div class="mkt-head" style="display:grid;grid-template-columns:150px 1fr 1fr 130px;gap:16px;padding:10px 0;border-bottom:1px solid var(--color-divider);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);"><span>Term</span><span>This offer</span><span>Typical new grad</span><span></span></div>${benchmarks}</div>
      </details>

      ${moreAsks.length ? `<details class="rsec">
        <summary><span class="rchev">&#9656;</span><span class="rtitle">The rest of the playbook</span><span class="rhint">${moreAsks.length} more ask${moreAsks.length > 1 ? "s" : ""}</span></summary>
        <div class="rbody">${moreAsksHtml}</div>

/* ─────────────────────────  compare  ───────────────────────── */
function gradeTone(overall) {
  if (overall >= 70) return "var(--color-accent-800)";
  if (overall >= 55) return "var(--color-accent-700)";
  return "#9e3b2b"; // a warm brick for caution, kept within the palette's temperature
}
function expectedGross(a) {
  const sc = a.financial_analysis.scenarios || [];
  const e = sc.find(s => /expected/i.test(s.label)) || sc[Math.floor(sc.length / 2)] || sc[0];
  return e ? money(e.estimated_annual_gross) : "—";
}
function highFlags(a) { return (a.red_flags || []).filter(fl => fl.severity === "high").length; }

function compareRows() {
  const c = a => a.extraction.compensation;
  const r = a => a.extraction.restrictive_covenants;
  const b = a => a.extraction.benefits;
  return [
    { label: "Expected year-one gross", get: a => `<span style="font-family:var(--font-heading);font-size:18px;font-feature-settings:'tnum';">${expectedGross(a)}</span>` },
    { label: "Exit bill (month 12)", get: a => esc(dash(a.exit_costs && a.exit_costs.estimated_total)) },
    { label: "High-severity flags", get: a => `<span style="font-feature-settings:'tnum';">${highFlags(a)}</span>` },
    { label: "Compensation basis", get: a => esc(dash(c(a).compensation_basis).replace(/_/g, " ")) },
    { label: "Daily guarantee", get: a => money(c(a).daily_guarantee) },
    { label: "Production %", get: a => c(a).production_percentage == null ? "—" : c(a).production_percentage + "%" },
    { label: "Guarantee duration", get: a => c(a).guarantee_duration_months == null ? "—" : c(a).guarantee_duration_months + " mo" },
    { label: "Sign-on bonus", get: a => money(c(a).sign_on_bonus) },
    { label: "Non-compete", get: a => (r(a).non_compete_radius_miles == null && r(a).non_compete_duration_months == null) ? "—" : `${r(a).non_compete_radius_miles ?? "?"} mi · ${r(a).non_compete_duration_months ?? "?"} mo` },
    { label: "Tail paid by", get: a => esc(dash(b(a).tail_coverage_paid_by)) },
    { label: "PTO", get: a => esc(dash(b(a).pto)) },
    { label: "CE allowance", get: a => esc(dash(b(a).ce_allowance)) },
  ];
}

function compare() {
  const offers = state.offers;
  const cols = offers.length;

  const headers = offers.map(o => {
    const x = o.analysis.extraction;
    return `<th style="min-width:190px;vertical-align:top;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <button data-open="${o.id}" style="text-align:left;background:none;border:none;cursor:pointer;font:inherit;padding:0;color:var(--color-text);">
          <div style="font-family:var(--font-heading);font-size:16px;letter-spacing:0;text-transform:none;">${esc(offerLabel(o))}</div>
          <div style="font-size:11px;letter-spacing:0.02em;text-transform:none;color:var(--color-neutral-600);margin-top:2px;">${esc([x.position_title, x.location].filter(Boolean).join(" · "))}</div>
        </button>
        <button data-remove="${o.id}" title="Remove review" aria-label="Remove review" style="background:none;border:none;cursor:pointer;color:var(--color-neutral-500);font-size:16px;line-height:1;">×</button>
      </div>
    </th>`;
  }).join("");

  const gradeCells = offers.map(o => {
    const s = o.analysis.score;
    return `<td><div style="font-family:var(--font-heading);font-size:40px;line-height:1;color:${gradeTone(s.overall)};">${esc(s.grade)}</div>
      <div style="font-size:12px;font-feature-settings:'tnum';color:var(--color-accent-700);letter-spacing:0.08em;">${s.overall} / 100</div></td>`;
  }).join("");

  const labelTh = txt => `<th style="text-transform:none;letter-spacing:0.02em;font-size:12px;color:var(--color-neutral-700);white-space:nowrap;">${txt}</th>`;
  const rows = compareRows().map(row => `
    <tr>${labelTh(esc(row.label))}${offers.map(o => `<td style="font-size:13.5px;">${row.get(o.analysis)}</td>`).join("")}</tr>`).join("");
  const viewRow = `<tr><td></td>${offers.map(o => `<td><button class="btn btn-secondary" data-open="${o.id}" style="font-size:12px;padding:5px 12px;">View full review →</button></td>`).join("")}</tr>`;

  const best = offers.slice().sort((p, q) => q.analysis.score.overall - p.analysis.score.overall)[0];

  return navBar() + `
  <main class="pad" style="flex:1;width:100%;max-width:1360px;margin:0 auto;padding:40px 48px 80px;">
    ${switcher("compare")}
    <div class="no-print" style="display:flex;justify-content:flex-end;margin-bottom:6px;">
      <button class="btn btn-secondary" data-print style="font-size:13px;padding:7px 16px;">↓ Save comparison as PDF</button>
    </div>
    <div style="text-align:center;margin-bottom:8px;">
      <div style="font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-accent-700);">Side by side</div>
      <h2 style="font-size:34px;margin:8px 0 0;">Compare your offers</h2>
    </div>
    <p class="text-muted" style="text-align:center;font-size:14px;max-width:72ch;margin:6px auto 26px;">By Bailey's grade, <em>${esc(offerLabel(best))}</em> comes out ahead — but read each full review before comparing on price alone. A higher production % on collections can pay less than a lower % on production.</p>
    <div class="table-wrap"><table class="table cmp-table" style="min-width:${Math.max(560, 190 * cols + 200)}px;">
      <thead><tr><th style="min-width:190px;"></th>${headers}</tr></thead>
      <tbody>
        <tr>${labelTh("Offer grade")}${gradeCells}</tr>
        ${rows}
        ${viewRow}
      </tbody>
    </table></div>
    <p class="text-muted" style="font-size:11.5px;max-width:88ch;margin-top:24px;">Bailey is an educational tool, not legal, financial, or tax advice. Figures are illustrative estimates drawn from each offer's stated terms.</p>
  </main>`;
}

        ${org.topFlags.map(([label, p]) => `<div style="display:grid;grid-template-columns:1fr 52px;gap:16px;align-items:center;">
          <div>
            <div style="font-size:14.5px;margin-bottom:6px;">${esc(label)}</div>
            <div style="height:8px;border-radius:4px;background:var(--color-neutral-200);"><div style="height:8px;border-radius:4px;width:${p}%;background:${org.accent};"></div></div>
          </div>
          <div style="font-family:var(--font-heading);font-size:18px;font-feature-settings:'tnum';text-align:right;color:${org.accent};">${p}%</div>
        </div>`).join("")}
      </div>
    </section>

    <section style="margin-top:44px;border-top:1px solid var(--color-divider);padding-top:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <p class="text-muted" style="font-size:12.5px;margin:0;max-width:70ch;">Figures are aggregated across your students' reviews; no individual contract, student, or employer is identifiable in this view. ${st.negotiatedPct}% of surveyed students reported negotiating at least one term after their review.</p>
      <button class="btn btn-secondary" data-orgportal style="font-size:13px;">View the student portal &rarr;</button>
    </section>
  </main>`;
}

const MARKETING_PAGES = { how: pageHow, features: pageInside, pricing: pagePricing, faq: pageFaq };
function goPage(p) {
  clearInterval(stepTimer);
  clearHash();
  set({ stage: p, error: "", sharedOffer: null });
  window.scrollTo(0, 0);
}

function routeHash() {
  const m = (location.hash || "").match(/^#org=([a-z0-9]+)(-admin)?$/i);
  if (m && ORGS[m[1].toLowerCase()]) {
    state.org = ORGS[m[1].toLowerCase()];
    set({ stage: m[2] ? "orgadmin" : "org", error: "" });
    window.scrollTo(0, 0);
    return true;
  }
  return false;
}
function onRoute() { if (!routeHash()) openSharedFromHash(); }

function render() {
  if (state.stage === "analyzing") app.innerHTML = analyzing();
  else if (state.stage === "org" && state.org) app.innerHTML = orgPortal(state.org);
  else if (state.stage === "orgadmin" && state.org) app.innerHTML = orgDashboard(state.org);
  else if (state.stage === "shared" && state.sharedOffer) app.innerHTML = report();
  else if (state.stage === "compare" && state.offers.length >= 2) app.innerHTML = compare();
  else if (state.stage === "report" && activeOffer()) app.innerHTML = report();
  else if (MARKETING_PAGES[state.stage]) app.innerHTML = MARKETING_PAGES[state.stage]();
  else app.innerHTML = landing();
  if (state.pickerOpen) app.insertAdjacentHTML("beforeend", samplePicker());
  if (state.quizOpen) app.insertAdjacentHTML("beforeend", quizModal());
  if (state.checkoutOpen) app.insertAdjacentHTML("beforeend", checkoutModal());
  if (state.adminOpen) app.insertAdjacentHTML("beforeend", adminModal());
  wire();
}

function wire() {
  // The file picker only opens after payment (see data-upload), so a chosen
  // file just runs the review. Institution portals wire data-file directly and
  // are covered, so this stays free for them too.
  app.querySelectorAll("[data-file]").forEach(fi => fi.addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    if (file) maybeQuizThen(() => analyzeFile(file));
  }));
  app.querySelectorAll("[data-upload]").forEach(b => b.addEventListener("click", () => startPaidReview(() => {
    const fi = app.querySelector("[data-file]");
    if (fi) fi.click();
  })));
  app.querySelectorAll("[data-sample]").forEach(b => b.addEventListener("click", () => startPaidReview(() => analyzeSample())));
  app.querySelectorAll("[data-samples]").forEach(b => b.addEventListener("click", () => set({ pickerOpen: true })));
  app.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => { const id = b.getAttribute("data-pick"); state.pickerOpen = false; maybeQuizThen(() => analyzeSample(id)); }));
  app.querySelectorAll("[data-compare-samples]").forEach(b => b.addEventListener("click", () => { state.pickerOpen = false; maybeQuizThen(loadCompareSamples); }));
  app.querySelectorAll("[data-modal-close]").forEach(b => b.addEventListener("click", () => set({ pickerOpen: false })));
  const modal = app.querySelector("[data-modal]");
  if (modal) modal.addEventListener("click", ev => { if (ev.target === modal) set({ pickerOpen: false }); });
  const shareBtn = app.querySelector("[data-share]");
  if (shareBtn) shareBtn.addEventListener("click", shareReport);
  app.querySelectorAll("[data-orgadmin]").forEach(b => b.addEventListener("click", () => { if (state.org) { history.replaceState(null, "", "#org=" + state.org.id + "-admin"); set({ stage: "orgadmin" }); window.scrollTo(0, 0); } }));
  app.querySelectorAll("[data-orgportal]").forEach(b => b.addEventListener("click", () => { if (state.org) { history.replaceState(null, "", "#org=" + state.org.id); set({ stage: "org" }); window.scrollTo(0, 0); } }));
  // checkout / paywall
  app.querySelectorAll("[data-checkout]").forEach(b => b.addEventListener("click", () => set({ checkoutOpen: true })));
  app.querySelectorAll("[data-checkout-close]").forEach(b => b.addEventListener("click", () => { state.pendingPaidAction = null; set({ checkoutOpen: false }); }));
  const stu = app.querySelector("[data-student]");
  if (stu) stu.addEventListener("change", () => set({ checkoutStudent: stu.checked }));
  app.querySelectorAll("[data-pay]").forEach(b => b.addEventListener("click", () => {
    const action = state.pendingPaidAction; state.pendingPaidAction = null;
    set({ checkoutOpen: false });   // close the modal, then run the paid action
    if (action) maybeQuizThen(action);
  }));
  const cm = app.querySelector("[data-modal-checkout]");
  if (cm) cm.addEventListener("click", ev => { if (ev.target === cm) { state.pendingPaidAction = null; set({ checkoutOpen: false }); } });
  // institution sign-in
  app.querySelectorAll("[data-admin]").forEach(b => b.addEventListener("click", () => set({ adminOpen: true, adminError: "" })));
  app.querySelectorAll("[data-admin-close]").forEach(b => b.addEventListener("click", () => set({ adminOpen: false })));
  app.querySelectorAll("[data-admin-go]").forEach(b => b.addEventListener("click", () => {
    const inp = app.querySelector("[data-admin-code]");
    const code = ((inp && inp.value) || "").trim().toLowerCase();
    const orgId = ADMIN_CODES[code];
    if (orgId && ORGS[orgId]) { state.org = ORGS[orgId]; state.adminOpen = false; history.replaceState(null, "", "#org=" + orgId + "-admin"); set({ stage: "orgadmin", adminError: "" }); window.scrollTo(0, 0); }
    else { set({ adminError: "That code didn't match. Check with your program coordinator." }); }
  }));
  const am = app.querySelector("[data-modal-admin]");
  if (am) am.addEventListener("click", ev => { if (ev.target === am) set({ adminOpen: false }); });
  app.querySelectorAll("[data-quiz]").forEach(b => b.addEventListener("click", () => set({ quizOpen: true, quizDraft: Object.assign({}, state.profile || {}) })));
  app.querySelectorAll("[data-quiz-opt]").forEach(b => b.addEventListener("click", () => {
    const parts = b.getAttribute("data-quiz-opt").split(":"), k = parts[0], v = parts[1];
    const d = Object.assign({}, state.quizDraft);
    d[k] = d[k] === v ? undefined : v;
    set({ quizDraft: d });
  }));
  app.querySelectorAll("[data-quiz-save]").forEach(b => b.addEventListener("click", () => closeQuiz(true)));
  app.querySelectorAll("[data-quiz-close]").forEach(b => b.addEventListener("click", () => closeQuiz(false)));
  const quizM = app.querySelector("[data-modal-quiz]");
  if (quizM) quizM.addEventListener("click", ev => { if (ev.target === quizM) closeQuiz(false); });
  app.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openReport(b.getAttribute("data-open"))));
  app.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); removeOffer(b.getAttribute("data-remove")); }));
  app.querySelectorAll("[data-compare]").forEach(b => b.addEventListener("click", openCompare));
  app.querySelectorAll("[data-new]").forEach(b => b.addEventListener("click", newReview));
  app.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", ev => {
    ev.preventDefault();
    const p = b.getAttribute("data-page");
    if (p === "landing") newReview(); else goPage(p);
    window.scrollTo(0, 0);
  }));
  const printBtn = app.querySelector("[data-print]");
  if (printBtn) printBtn.addEventListener("click", () => window.print());
  const burger = app.querySelector("[data-burger]");
  const menu = app.querySelector(".mobile-menu");
  if (burger && menu) burger.addEventListener("click", () => {
    const open = menu.classList.toggle("open");
    burger.classList.toggle("open", open);
    burger.setAttribute("aria-expanded", open ? "true" : "false");
  });
  const copyBtn = app.querySelector("[data-copy]");
  if (copyBtn) copyBtn.addEventListener("click", () => {
    const o = activeOffer();
    if (o) copyEmail(o.analysis.negotiation_email);
  });
}

render();
onRoute();
window.addEventListener("hashchange", onRoute);
</script>
</body>
</html>
